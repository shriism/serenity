name: Desktop

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke packaged macOS app
        if: runner.os == 'macOS'
        run: npx tsx tests/desktop-smoke.ts
        env:
          SERENITY_SMOKE_EXECUTABLE: release/mac-arm64/Serenity.app/Contents/MacOS/Serenity
      - name: Smoke packaged Windows app
        if: runner.os == 'Windows'
        run: npx tsx tests/desktop-smoke.ts
        env:
          SERENITY_SMOKE_EXECUTABLE: release/win-unpacked/Serenity.exe
      - name: Configure Linux Chromium sandbox on runner
        if: runner.os == 'Linux'
        run: sudo chown root:root release/linux-unpacked/chrome-sandbox && sudo chmod 4755 release/linux-unpacked/chrome-sandbox
      - name: Smoke packaged Linux app
        if: runner.os == 'Linux'
        run: xvfb-run -a npx tsx tests/desktop-smoke.ts
        env:
          SERENITY_SMOKE_EXECUTABLE: release/linux-unpacked/serenity
          SERENITY_SMOKE_CREDENTIALS: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: serenity-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
          if-no-files-found: error
